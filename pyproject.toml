[project]
name = "job-engine"
version = "0.1.0"
description = "A modular, local-first job discovery and application assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<0.142.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "alembic>=1.13.1,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "pytest-asyncio>=0.23.6,<2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "anyio>=4.14.2,<5.0.0",
]


[tool.pytest.ini_options]
# We ignore the httpx2 deprecation warning from Starlette's TestClient because httpx2 is a known malicious typosquat. We refuse to install it.
# We also ignore the anyio deprecation warning triggered by Starlette internally.
filterwarnings = [
    "ignore:.*httpx.*:DeprecationWarning",
    "ignore:.*anyio.*:DeprecationWarning",
]
